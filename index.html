<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bachacos</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%; height: 100%;
        background: #111827;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* Contenedor del juego Phaser.
         El juego no se muestra más grande que un teléfono Android promedio (412×915 CSS px).
         Phaser.Scale.FIT se ajusta al tamaño del contenedor → en escritorio queda centrado
         con el tamaño de un móvil; en un móvil real ocupa toda la pantalla. */
      #app {
        width: 100%;
        max-width: 412px;
        flex: 1 1 auto;          /* ocupa el espacio disponible restando el banner */
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas { display: block; margin: auto; touch-action: none; }

      /* ── Banner de publicidad ── */
      #ad-banner {
        width: 100%;
        max-width: 412px;
        height: 60px;
        flex: 0 0 60px;
        background: #0d1117;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        overflow: hidden;
      }

      /* Estilo de publicidad de prueba (web/PC).
         En Android/Capacitor AdMob reemplaza este elemento con un banner nativo. */
      .ad-placeholder {
        width: 320px;
        height: 50px;
        background: linear-gradient(135deg, #1e3a5f 0%, #0d2137 100%);
        border: 1px solid #2a5080;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        gap: 10px;
        font-family: Arial, sans-serif;
      }
      .ad-label {
        font-size: 9px;
        color: #5a7a9a;
        text-transform: uppercase;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .ad-content {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        justify-content: center;
      }
      .ad-icon {
        font-size: 22px;
      }
      .ad-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .ad-title {
        font-size: 11px;
        font-weight: bold;
        color: #e0f0ff;
      }
      .ad-desc {
        font-size: 9px;
        color: #8abadc;
      }
      .ad-cta {
        font-size: 10px;
        font-weight: bold;
        color: #ffffff;
        background: #1a7bbf;
        border-radius: 4px;
        padding: 4px 8px;
        white-space: nowrap;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Banner de publicidad (visible en web/PC como placeholder de prueba) -->
    <div id="ad-banner">
      <div class="ad-placeholder">
        <span class="ad-label">Ad</span>
        <div class="ad-content">
          <span class="ad-icon">🐜</span>
          <div class="ad-text">
            <span class="ad-title">Bachacos Premium</span>
            <span class="ad-desc">¡Desbloquea todos los niveles!</span>
          </div>
        </div>
        <span class="ad-cta">Instalar</span>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
